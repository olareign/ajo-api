# Render Blueprint. Secrets are set in the Render dashboard (sync: false), never here.
# Services talk over Render's private network; nothing but the API is public.
services:
  - type: web
    name: ajo-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/ready
    preDeployCommand: node dist/database/migrate.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ajo-db
          property: connectionString
      # Internal connections stay on Render's private network.
      - key: DATABASE_SSL
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ajo-redis
          property: connectionString
      - key: WEB_APP_URL
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREACHED_PASSWORD_CHECK
        value: hibp
      # Signs access tokens; only the API needs it.
      - key: JWT_SECRET
        generateValue: true

  - type: worker
    name: ajo-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/worker.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ajo-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ajo-redis
          property: connectionString
      - key: WEB_APP_URL
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREACHED_PASSWORD_CHECK
        value: hibp

  - type: keyvalue
    name: ajo-redis
    plan: starter
    region: frankfurt
    # Queues must never lose jobs to eviction.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: ajo-db
    plan: basic-1gb
    region: frankfurt
    databaseName: ajo
    postgresMajorVersion: "17"
    ipAllowList: []
