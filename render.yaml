# Render Blueprint. Secrets are set in the Render dashboard (sync: false), never here.
# The database is Neon (Frankfurt, Postgres 17), not Render Postgres. Redis stays on Render's private network.
services:
  - type: web
    name: ajo-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/ready
    preDeployCommand: node dist/database/migrate.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The Neon direct (non-pooled) connection string, set in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Neon requires TLS.
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ajo-redis
          property: connectionString
      - key: WEB_APP_URL
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: BREACHED_PASSWORD_CHECK
        value: hibp
      # Bot protection on sign-up (Cloudflare Turnstile). Set the SECRET key in the dashboard,
      # never the site key; the API refuses to start in production without it.
      - key: BOT_CHECK
        value: turnstile
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Payments. Paste each value in the dashboard; leave it empty to leave payments off.
      # Webhook URL to register with Paystack: <this API>/api/v1/webhooks/paystack.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Shared with the web app's server (the same value in its BFF_SHARED_SECRET): lets the API see each
      # person's own address and device, so rate limits and sign-in alerts are per person.
      - key: BFF_SHARED_SECRET
        sync: false
      # Signs access tokens; only the API needs it.
      - key: JWT_SECRET
        generateValue: true
      # Encrypts authenticator secrets and other sensitive columns (32 random bytes, base64).
      # Losing or changing it makes those values unreadable, so never regenerate it casually.
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true

  - type: worker
    name: ajo-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/worker.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ajo-redis
          property: connectionString
      - key: WEB_APP_URL
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: BREACHED_PASSWORD_CHECK
        value: hibp
      # Every process loads the same environment rules, so the worker needs these too.
      - key: BOT_CHECK
        value: turnstile
      - key: TURNSTILE_SECRET_KEY
        sync: false

  - type: keyvalue
    name: ajo-redis
    plan: starter
    region: frankfurt
    # Queues must never lose jobs to eviction.
    maxmemoryPolicy: noeviction
    ipAllowList: []
